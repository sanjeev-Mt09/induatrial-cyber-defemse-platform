persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT: used by services inside the Docker network
# (published on 127.0.0.1 only on the host)
listener 1883
allow_anonymous true

# MQTT over TLS: for clients outside the Docker network
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous true

# NOTE: allow_anonymous is for lab/dev use only.
# For production, use a password file or client certificates
# (require_certificate true) and ACLs.
